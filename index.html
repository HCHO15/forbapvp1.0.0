<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>移行のお知らせ</title>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: system-ui, sans-serif;
    background: rgba(0,0,0,0.55);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden; /* スクロール禁止 */
  }

  #migrationModal {
    background: #fff;
    padding: 24px;
    border-radius: 10px;
    width: 360px;
    max-width: 90%;
    box-shadow: 0 0 12px rgba(0,0,0,0.35);
    text-align: left;
    font-size: 15px;
  }

  #migrationModal h3 {
    margin-top: 0;
    font-size: 18px;
  }

  #migrationModal a {
    color: #1e88e5;
    word-break: break-all;
  }

  /* ダークモード対応（任意） */
  @media (prefers-color-scheme: dark) {
    body {
      background: rgba(0,0,0,0.7);
    }
    #migrationModal {
      background: #222;
      color: #eee;
    }
  }
</style>
</head>

<body>

<div id="migrationModal">
  <h3>お知らせ</h3>
  <p>このツールは以下のページに移行しました。</p>
  <p>
    <a href="https://hcho15.github.io/pvpmap/" target="_blank" rel="noopener">
      https://hcho15.github.io/pvpmap/
    </a>
  </p>
  <p style="margin-top: 12px; font-size: 13px; opacity: 0.8;">
    新しいページを開いてご利用ください。
  </p>
</div>

</body>
</html>
